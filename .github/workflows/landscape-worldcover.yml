name: Landscape real WorldCover data gate

on:
  pull_request:
    paths:
      - 'src/features/landscape/**'
      - 'scripts/landscape/**'
      - '.github/workflows/landscape-worldcover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-worldcover-crop:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geospatial data dependencies
        run: python -m pip install rasterio==1.4.3 pyproj==3.7.2 numpy==2.2.6
      - name: Read official ESA COG window; fail on missing/unknown classes
        run: python scripts/landscape/ingest_worldcover.py --out /tmp/worldcover-shinjuku.json --emit-compressed-stdout
      - name: Save audited crop as an ephemeral CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: worldcover-shinjuku-2021-verified-window
          path: /tmp/worldcover-shinjuku.json
          retention-days: 7
